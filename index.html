<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Личный кабинет</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================= -->
    <!-- ОКНО РЕГИСТРАЦИИ -->
    <!-- ========================= -->

    <div class="registration-card" id="registrationWindow">

        <h1>Регистрация</h1>

        <div class="form-group">
            <label for="name">Имя *</label>

            <input
                type="text"
                id="name"
                placeholder="Введите имя"
            >
        </div>

        <div class="form-group">
            <label for="phone">Телефон *</label>

            <input
                type="tel"
                id="phone"
                placeholder="+7 (___) ___-__-__"
            >
        </div>

        <div class="form-group">
            <label for="email">E-mail *</label>

            <input
                type="email"
                id="email"
                placeholder="Введите e-mail"
            >
        </div>

        <div class="form-group">
            <label for="club">Спортивный клуб</label>

            <input
                type="text"
                id="club"
                placeholder="Введите название клуба"
            >
        </div>

        <div class="agreement">

            <input
                type="checkbox"
                id="agreement"
            >

            <label for="agreement">
                Согласие с
                <a href="#" id="offer">
                    Правилами публичной оферты
                </a>
            </label>

        </div>

        <button id="register">
            Зарегистрироваться
        </button>

        <p id="error"></p>

    </div>


    <!-- ========================= -->
    <!-- ЛИЧНЫЙ КАБИНЕТ -->
    <!-- ========================= -->

    <div class="account-card" id="accountWindow">

        <h1>
            ЛК Партнера:
            <span id="accountName"></span>
        </h1>

        <div class="balance">
            <p>Ваш баланс:</p>

            <strong id="accountBalance">
                0 ₽
            </strong>
        </div>

        <div class="account-menu">

            <a href="#" class="account-link" id="history">
                История
            </a>

            <a href="#" class="account-link" id="referrals">
                Мои рефералы
            </a>

            <a href="#" class="account-link" id="rewards">
                Вознаграждение
            </a>

        </div>

    </div>


    <!-- ========================= -->
    <!-- ОКНО ВОЗНАГРАЖДЕНИЯ -->
    <!-- ========================= -->

    <div class="account-card" id="rewardWindow">

        <h1>Вознаграждение</h1>

        <div class="reward-block" id="registrationReward">

            <p class="reward-description">
                Награда за регистрацию
            </p>

            <strong class="reward-amount">
                50 ₽
            </strong>

            <button id="claimReward">
                Забрать
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- ОКНО ПРИГЛАШЕНИЯ -->
    <!-- ========================= -->

    <div class="registration-card" id="inviteWindow">

        <h1>Пригласить клуб</h1>

        <div class="form-group">
            <label for="inviteClubName">
                Название клуба *
            </label>

            <input
                type="text"
                id="inviteClubName"
                placeholder="Введите название клуба"
            >
        </div>

        <div class="form-group">
            <label for="inviteManagerName">
                ФИО руководителя *
            </label>

            <input
                type="text"
                id="inviteManagerName"
                placeholder="Введите ФИО руководителя"
            >
        </div>

        <div class="form-group">
            <label for="invitePhone">
                Телефон *
            </label>

            <input
                type="tel"
                id="invitePhone"
                placeholder="+7 (___) ___-__-__"
            >
        </div>

        <div class="form-group">
            <label for="inviteEmail">
                E-mail
            </label>

            <input
                type="email"
                id="inviteEmail"
                placeholder="Введите e-mail"
            >
        </div>

        <div class="form-group">
            <label for="clubInfo">
                Информация о клубе
            </label>

            <input
                type="text"
                id="clubInfo"
                placeholder="Введите информацию о клубе"
            >
        </div>

        <div class="agreement">

            <input
                type="checkbox"
                id="managerNotice"
            >

            <label for="managerNotice">
                Подтверждаю, что сообщил о предстоящем
                звонке Менеджера <strong>SportCRM</strong>.
            </label>

        </div>

        <button id="sendInvite">
            Пригласить
        </button>

        <p id="inviteError"></p>

    </div>


    <!-- ========================= -->
    <!-- ФУТЕР -->
    <!-- ========================= -->

    <footer id="footer">

        <button id="inviteButton">
            Пригласить
        </button>

    </footer>


    <script src="https://st.max.ru/js/max-web-app.js"></script>

    <script src="app.js"></script>

</body>

</html>
